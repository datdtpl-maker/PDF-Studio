name: Release Windows app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build Windows installer
        run: pnpm desktop:build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Setup-${{ steps.version.outputs.value }}
          path: release/PDF-Studio-Setup-${{ steps.version.outputs.value }}.exe
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $installer = "release/PDF-Studio-Setup-${{ steps.version.outputs.value }}.exe"
          gh release create $env:GITHUB_REF_NAME $installer `
            --verify-tag `
            --title "PDF Studio ${{ steps.version.outputs.value }}" `
            --generate-notes
